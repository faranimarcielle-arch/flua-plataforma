name: Publicar funções no Supabase

# Manual for now: the function is deployed from the Supabase dashboard editor.
# To automate later, add the SUPABASE_ACCESS_TOKEN secret and restore the push trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: spwcyhjqdxasgloujbyz
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar a função chat
        run: supabase functions deploy chat --project-ref "$PROJECT_REF" --no-verify-jwt
