<link rel="apple-touch-icon" href="../../img/apple-touch-icon.png">

<body>
<main style="max-width:480px">
  <header id="nav"></header>
  <div class="card">
    <h1>Trocar senha</h1>
    <p class="muted">Crie uma senha só sua, com pelo menos 8 caracteres.</p>
    <form id="form" class="row" style="flex-direction:column;align-items:stretch" novalidate>
      <label class="f" for="password">Nova senha<input type="password" id="password" autocomplete="new-password" required minlength="8" maxlength="72"></label>
      <label class="f" for="password2">Repita a nova senha<input type="password" id="password2" autocomplete="new-password" required minlength="8" maxlength="72"></label>
      <button class="btn primary" type="submit" id="send" style="align-self:flex-start">Salvar nova senha</button>
    </form>
    <p class="status" id="status" role="status"></p>
  </div>
  <a class="small" href="../inicio/">Voltar para o início</a>
</main>
<script type="module" src="senha.js"></script>
</body>
</html>
