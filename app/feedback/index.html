<body>
<main>
  <header id="nav"></header>
  <div>
    <h1>Feedback anônimo</h1>
    <p class="muted">Conte o que está funcionando e o que pode melhorar nas aulas e na plataforma. A professora lê sem saber quem escreveu: só a semana fica registrada.</p>
  </div>
  <div class="card">
    <label class="f" for="fb-text">Sua mensagem<textarea id="fb-text" rows="6" maxlength="1500"></textarea></label>
    <div class="row"><button class="btn primary" id="fb-send" type="button">Enviar anonimamente</button></div>
    <p class="status" id="fb-status" role="status"></p>
  </div>
</main>
<script type="module" src="feedback.js"></script>
